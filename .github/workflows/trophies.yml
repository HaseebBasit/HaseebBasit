name: Generate GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Clone GitHub Profile Trophy
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/github-profile-trophy

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/github-profile-trophy

          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            ./render_svg.ts \
            HaseebBasit \
            "$GITHUB_WORKSPACE/assets" \
            tokyonight

          echo "Generated files:"
          ls -la "$GITHUB_WORKSPACE/assets"

      - name: Rename generated trophy
        run: |
          find assets -type f -name "*.svg" -print

          TROPHY_FILE=$(find assets -maxdepth 1 -type f -name "*.svg" | head -n 1)

          if [ -z "$TROPHY_FILE" ]; then
            echo "ERROR: Trophy SVG was not generated."
            exit 1
          fi

          mv "$TROPHY_FILE" assets/github-trophies.svg

      - name: Verify trophy
        run: |
          test -s assets/github-trophies.svg
          grep -q "<svg" assets/github-trophies.svg
          echo "Trophy SVG generated successfully."

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-trophies.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub trophies"
            git push
          fi
